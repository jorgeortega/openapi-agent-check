name: Rule proposal
description: A new rule, or a change to what a rule scores.
labels: [rules]
body:
  - type: markdown
    attributes:
      value: |
        A change to the rules is a new rules version, and every copy of the rules (the CLI, the hosted check, the badge, the Agentify kit) moves together. See "Where rule changes start" in CONTRIBUTING.md.
  - type: textarea
    id: catch
    attributes:
      label: What the rule should catch
      description: In one or two sentences.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What an agent gets wrong without it
      description: A model's tool call that fails, loops or does the wrong thing because the spec leaves this out. A real example is best.
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: A spec that passes and one that fails
      render: yaml
    validations:
      required: true
  - type: textarea
    id: weight
    attributes:
      label: Weight and fix
      description: How much it should cost (the weights today run from 4 to 10), and the one-line fix the report would show. Could `--fix` write it?
