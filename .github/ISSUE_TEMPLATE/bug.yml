name: Bug
description: The CLI, the library, the Spectral ruleset or the Action did something wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what it printed, and what you expected instead.
      render: text
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: A spec that shows it
      description: The smallest OpenAPI document (or the part of it) that reproduces the problem. Remove anything private first.
      render: yaml
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `npx openapi-agent-check --version` (or the Action's `version`).
      placeholder: openapi-agent-check 1.2.0 (rules 1.0.4)
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: Node 22.11, macOS 15
